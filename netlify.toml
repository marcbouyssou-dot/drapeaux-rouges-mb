[build]
command = "flutter build web --release --target lib/main_radar.dart"
publish = "build/web"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manifest.json"
[headers.values]
Content-Type = "application/manifest+json; charset=utf-8"
Cache-Control = "no-cache"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
